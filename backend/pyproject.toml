[project]
name = "ledgerly"
version = "0.1.0"
description = "Ledgerly — personal financial data platform"
requires-python = ">=3.11"

# Kept deliberately thin. Every dependency here ships inside a Lambda package,
# and ADR 0001 (Athena MERGE INTO for Iceberg writes) exists partly so that we
# never need PyIceberg/PyArrow in the runtime.
dependencies = [
    "boto3>=1.34",
    "plaid-python>=20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "moto[s3,dynamodb,secretsmanager]>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
